###############################################################################
#  Bedroom Hue lights – scenes, bedtime, daylight lock, night mode, wake-up
#
#  ▶ The ONLY thing you need to edit is the "YOUR DEVICES" section below.
#    Find your entity IDs in Home Assistant → Settings → Devices & services →
#    Entities (search "light." and your phone's "battery state").
#
#  Everything else (the app, scenes, automations) uses the groups defined here.
###############################################################################

# ─────────────────────────── YOUR DEVICES ────────────────────────────────────
# Change the four light IDs here (they are re-used below with *anchors).
light:
  - platform: group
    name: Bedside Lamps            # → light.bedside_lamps
    unique_id: bedroom_bedside_lamps
    entities:
      - &lamp_left  light.bedside_left       # ← your left bedside lamp
      - &lamp_right light.bedside_right      # ← your right bedside lamp

  - platform: group
    name: Downlights               # → light.downlights
    unique_id: bedroom_downlights
    entities:
      - &down_1 light.downlight_1            # ← your first downlight
      - &down_2 light.downlight_2            # ← your second downlight

  - platform: group
    name: Bedroom All Lights       # → light.bedroom_all_lights
    unique_id: bedroom_all_lights
    entities: [*lamp_left, *lamp_right, *down_1, *down_2]

template:
  - binary_sensor:
      # Change sensor.my_phone_battery_state to your phone's sensor from the
      # Home Assistant Companion app (iPhone & Android both provide it).
      #
      # Charging is read from whichever reported most recently:
      #  • the Companion app's battery state (can lag on iPhone, and stops
      #    completely if the app is swiped away), or
      #  • input_boolean.bedroom_phone_on_charger, which an iPhone Shortcuts
      #    automation flips instantly on charger connect/disconnect (README).
      - name: Bedroom Phone Charging
        unique_id: bedroom_phone_charging
        icon: mdi:battery-charging
        state: >
          {% set app = states.sensor.my_phone_battery_state %}
          {% set shortcut = states.input_boolean.bedroom_phone_on_charger %}
          {% set app_ok = app is not none and app.state not in ['unknown', 'unavailable'] %}
          {% if app_ok and (shortcut is none or app.last_changed > shortcut.last_changed) %}
            {{ app.state | lower in ['charging', 'full'] }}
          {% else %}
            {{ shortcut is not none and shortcut.state == 'on' }}
          {% endif %}

      # Partner's phone – same idea. Optional: change sensor.partner_phone_battery_state
      # to their Companion app sensor, or just use the iPhone Shortcuts with
      # input_boolean.bedroom_partner_phone_on_charger (README).
      - name: Bedroom Partner Phone Charging
        unique_id: bedroom_partner_phone_charging
        icon: mdi:battery-charging-outline
        state: >
          {% set app = states.sensor.partner_phone_battery_state %}
          {% set shortcut = states.input_boolean.bedroom_partner_phone_on_charger %}
          {% set app_ok = app is not none and app.state not in ['unknown', 'unavailable'] %}
          {% if app_ok and (shortcut is none or app.last_changed > shortcut.last_changed) %}
            {{ app.state | lower in ['charging', 'full'] }}
          {% else %}
            {{ shortcut is not none and shortcut.state == 'on' }}
          {% endif %}

      # Is anyone home? Uses both phones' location from the Companion app
      # (change device_tracker.my_phone / device_tracker.partner_phone to yours)
      # plus anyone Home Assistant tracks as a person.
      - name: Bedroom Someone Home
        unique_id: bedroom_someone_home
        icon: mdi:home-account
        state: >
          {{ states('zone.home') | int(0) > 0
             or is_state('device_tracker.my_phone', 'home')
             or is_state('device_tracker.partner_phone', 'home') }}

# ──────────────────────── nothing to edit below here ─────────────────────────

      - name: Bedroom Is Daytime
        unique_id: bedroom_is_daytime
        icon: mdi:white-balance-sunny
        # Sun more than 3° above the horizon = proper daylight.
        state: "{{ state_attr('sun.sun', 'elevation') | float(-90) > 3 }}"

  - sensor:
      # day / evening / night – used by the app and the automations.
      - name: Bedroom Light Period
        unique_id: bedroom_light_period
        icon: mdi:theme-light-dark
        state: >
          {% set t = now().strftime('%H:%M:%S') %}
          {% set bed = states('input_datetime.bedroom_bedtime') %}
          {% set wake = states('input_datetime.bedroom_wake_time') %}
          {% if bed > wake %}
            {% set night = t >= bed or t < wake %}
          {% else %}
            {% set night = t >= bed and t < wake %}
          {% endif %}
          {% if night %}night
          {% elif is_state('binary_sensor.bedroom_is_daytime', 'on') %}day
          {% else %}evening{% endif %}

input_boolean:
  bedroom_sleep_mode:
    name: Bedroom sleep mode
    icon: mdi:sleep
  bedroom_auto_goodnight:
    name: Goodnight when phone charges at bedtime
    icon: mdi:power-plug-battery
  bedroom_night_soft_start:
    name: Gentle lights at night
    icon: mdi:weather-night
  bedroom_daytime_lockout:
    name: Daylight lock
    icon: mdi:lock-clock
  bedroom_wake_light:
    name: Wake-up light
    icon: mdi:weather-sunset-up
  bedroom_wake_weekdays_only:
    name: Wake-up light weekdays only
    icon: mdi:calendar-week
  bedroom_away_off:
    name: Lights off when everyone leaves
    icon: mdi:home-export-outline
  bedroom_phone_on_charger:
    name: Phone on charger (set by iPhone Shortcut)
    icon: mdi:power-plug
  bedroom_partner_phone_on_charger:
    name: Partner phone on charger (set by iPhone Shortcut)
    icon: mdi:power-plug-outline
  bedroom_wait_for_both_phones:
    name: Goodnight waits for both phones
    icon: mdi:account-multiple-check
  bedroom_wind_down:
    name: Wind-down before bedtime
    icon: mdi:weather-night-partly-cloudy
  bedroom_sunset_welcome:
    name: Lights on at sunset / when you get home
    icon: mdi:home-lightbulb-outline
  bedroom_me_in_bed:
    name: In bed (me)
    icon: mdi:bed
  bedroom_partner_in_bed:
    name: In bed (partner)
    icon: mdi:bed-outline
  bedroom_waiting_for_partner:
    name: Nightlight on, waiting for the other person
    icon: mdi:bed-clock
  bedroom_defaults_applied:
    name: Bedroom defaults applied (internal)
    icon: mdi:cog

input_text:
  bedroom_last_scene:
    name: Bedroom last scene
    max: 32
    icon: mdi:palette

input_datetime:
  bedroom_bedtime:
    name: Bedtime (from)
    has_date: false
    has_time: true
  bedroom_wake_time:
    name: Wake time
    has_date: false
    has_time: true

input_number:
  bedroom_goodnight_fade_min:
    name: Goodnight fade (minutes)
    min: 0
    max: 10
    step: 1
    mode: slider
    icon: mdi:timer-sand
  bedroom_night_brightness:
    name: Night brightness (%)
    min: 1
    max: 30
    step: 1
    mode: slider
    icon: mdi:brightness-4
  bedroom_wake_fade_min:
    name: Wake-up fade (minutes)
    min: 5
    max: 45
    step: 5
    mode: slider
    icon: mdi:weather-sunset-up

timer:
  bedroom_daylight_override:
    name: Daylight lock paused
    duration: "01:00:00"
    restore: true
    icon: mdi:lock-open-variant
  bedroom_sleep_timer:
    name: Sleep timer
    duration: "00:30:00"
    restore: true
    icon: mdi:timer-outline

###############################################################################
#  SCENES – warm and colourful only, no cool/blue-white light.
#  Each scene "paints" the lights via script.bedroom_paint:
#    lamp_bri / down_bri   brightness % (0 = off)
#    l1, l2 / d1, d2       RGB colours for left/right lamp and downlight 1/2
#    lamp_k / down_k       warm white (kelvin) used when no colour is given,
#                          or when the bulbs can't do colour
###############################################################################
script:
  bedroom_paint:
    alias: "Bedroom · Paint lights (used by scenes)"
    icon: mdi:palette
    mode: parallel
    sequence:
      - variables:
          lamps_colour: "{{ state_attr('light.bedside_lamps', 'supported_color_modes') | default([], true) | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 }}"
          downs_colour: "{{ state_attr('light.downlights', 'supported_color_modes') | default([], true) | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 }}"
          t: "{{ transition | default(2) }}"
      - if: "{{ scene is defined }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.bedroom_last_scene }
            data: { value: "{{ scene }}" }
      - if: "{{ lamp_bri | default(0) | int == 0 }}"
        then:
          - action: light.turn_off
            target: { entity_id: light.bedside_lamps }
            data: { transition: "{{ t }}" }
        else:
          - if: "{{ lamps_colour and l1 is defined }}"
            then:
              - action: light.turn_on
                target: { entity_id: *lamp_left }
                data: { brightness_pct: "{{ lamp_bri }}", rgb_color: "{{ l1 }}", transition: "{{ t }}" }
              - action: light.turn_on
                target: { entity_id: *lamp_right }
                data: { brightness_pct: "{{ lamp_bri }}", rgb_color: "{{ l2 | default(l1) }}", transition: "{{ t }}" }
            else:
              - action: light.turn_on
                target: { entity_id: light.bedside_lamps }
                data: { brightness_pct: "{{ lamp_bri }}", color_temp_kelvin: "{{ lamp_k | default(2200) }}", transition: "{{ t }}" }
      - if: "{{ down_bri | default(0) | int == 0 }}"
        then:
          - action: light.turn_off
            target: { entity_id: light.downlights }
            data: { transition: "{{ t }}" }
        else:
          - if: "{{ downs_colour and d1 is defined }}"
            then:
              - action: light.turn_on
                target: { entity_id: *down_1 }
                data: { brightness_pct: "{{ down_bri }}", rgb_color: "{{ d1 }}", transition: "{{ t }}" }
              - action: light.turn_on
                target: { entity_id: *down_2 }
                data: { brightness_pct: "{{ down_bri }}", rgb_color: "{{ d2 | default(d1) }}", transition: "{{ t }}" }
            else:
              - action: light.turn_on
                target: { entity_id: light.downlights }
                data: { brightness_pct: "{{ down_bri }}", color_temp_kelvin: "{{ down_k | default(2200) }}", transition: "{{ t }}" }

  bedroom_scene_golden:
    alias: "Scene · Golden"
    icon: mdi:white-balance-sunny
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: golden
          lamp_bri: 100
          l1: [255, 170, 60]
          down_bri: 100
          d1: [255, 185, 80]
          lamp_k: 2400
          down_k: 2400
          transition: 1

  bedroom_scene_citrus:
    alias: "Scene · Citrus"
    icon: mdi:fruit-citrus
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: citrus
          lamp_bri: 100
          l1: [255, 120, 0]
          l2: [255, 150, 20]
          down_bri: 90
          d1: [255, 200, 40]
          lamp_k: 2400
          down_k: 2400
          transition: 1

  bedroom_scene_read:
    alias: "Scene · Read"
    icon: mdi:book-open-variant
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: read
          lamp_bri: 85
          lamp_k: 2700
          down_bri: 30
          d1: [255, 170, 80]
          down_k: 2400
          transition: 1

  bedroom_scene_relax:
    alias: "Scene · Relax"
    icon: mdi:sofa
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: relax
          lamp_bri: 55
          lamp_k: 2200
          down_bri: 45
          d1: [255, 140, 90]
          down_k: 2200

  bedroom_scene_movie:
    alias: "Scene · Movie"
    icon: mdi:movie-open
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: movie
          lamp_bri: 20
          lamp_k: 2200
          down_bri: 0

  bedroom_scene_sunset:
    alias: "Scene · Sunset"
    icon: mdi:weather-sunset
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: sunset
          lamp_bri: 70
          l1: [255, 120, 40]
          l2: [255, 70, 110]
          down_bri: 30
          d1: [255, 90, 60]
          d2: [255, 60, 120]
          lamp_k: 2000
          down_k: 2200

  bedroom_scene_rose:
    alias: "Scene · Rose"
    icon: mdi:flower
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: rose
          lamp_bri: 60
          l1: [255, 90, 150]
          l2: [255, 120, 170]
          down_bri: 35
          d1: [255, 60, 120]
          d2: [230, 80, 200]

  bedroom_scene_ocean:
    alias: "Scene · Ocean"
    icon: mdi:waves
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: ocean
          lamp_bri: 50
          l1: [0, 180, 255]
          l2: [0, 220, 200]
          down_bri: 30
          d1: [20, 80, 255]
          d2: [0, 150, 220]

  bedroom_scene_aurora:
    alias: "Scene · Aurora"
    icon: mdi:aurora
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: aurora
          lamp_bri: 55
          l1: [60, 255, 140]
          l2: [140, 80, 255]
          down_bri: 30
          d1: [0, 200, 170]
          d2: [100, 60, 255]

  bedroom_scene_galaxy:
    alias: "Scene · Galaxy"
    icon: mdi:creation
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: galaxy
          lamp_bri: 55
          l1: [140, 60, 255]
          l2: [40, 110, 255]
          down_bri: 20
          d1: [90, 40, 200]
          d2: [60, 30, 180]

  bedroom_scene_lavender:
    alias: "Scene · Lavender"
    icon: mdi:flower-tulip
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: lavender
          lamp_bri: 55
          l1: [190, 140, 255]
          l2: [210, 160, 255]
          down_bri: 35
          d1: [170, 120, 255]

  bedroom_scene_nightlight:
    alias: "Scene · Nightlight"
    icon: mdi:weather-night
    mode: restart
    sequence:
      - action: script.bedroom_paint
        data:
          scene: nightlight
          lamp_bri: 3
          l1: [255, 90, 20]
          lamp_k: 2000
          down_bri: 0
          transition: 1

  ##########################################################################
  #  ROUTINES
  ##########################################################################
  bedroom_all_off:
    alias: "Bedroom · All off"
    icon: mdi:lightbulb-off
    mode: restart
    sequence:
      - action: light.turn_off
        target: { entity_id: light.bedroom_all_lights }
        data: { transition: 1 }

  bedroom_goodnight:
    alias: "Bedroom · Goodnight"
    icon: mdi:sleep
    mode: restart
    sequence:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.bedroom_sleep_mode }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.bedroom_waiting_for_partner }
      - action: script.turn_off
        target:
          entity_id:
            - script.bedroom_wake_up
            - script.bedroom_wind_down
      # Fade every light that's on straight down from whatever it's showing
      # (colour, brightness, nightlight…) to off. Never brightens first.
      - action: light.turn_off
        target: { entity_id: light.bedroom_all_lights }
        data:
          transition: "{{ [(states('input_number.bedroom_goodnight_fade_min') | float(1) * 60) | int, 2] | max }}"

  # "I'm going to bed" – from a phone going on charge at night, or the
  # Goodnight button in Glow (which knows whose phone it is).
  bedroom_in_bed:
    alias: "Bedroom · Someone is going to bed"
    icon: mdi:bed
    mode: queued
    fields:
      who:
        description: "me or partner"
        example: me
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: >
            {{ 'input_boolean.bedroom_partner_in_bed' if who == 'partner' else 'input_boolean.bedroom_me_in_bed' }}
      - if:
          - condition: state
            entity_id: input_boolean.bedroom_wait_for_both_phones
            state: "off"
        then:
          - action: script.bedroom_goodnight
        else:
          - action: script.bedroom_bedtime_check

  # One-tap versions for lock-screen buttons, widgets and Siri (no data needed).
  bedroom_goodnight_me:
    alias: "Goodnight (me)"
    icon: mdi:sleep
    mode: queued
    sequence:
      - action: script.bedroom_in_bed
        data: { who: me }

  bedroom_goodnight_partner:
    alias: "Goodnight (partner)"
    icon: mdi:sleep
    mode: queued
    sequence:
      - action: script.bedroom_in_bed
        data: { who: partner }

  # Two-step bedtime (when "Wait for both phones" is on):
  #  • everyone at home is in bed  → Goodnight (lights fade off)
  #  • only some of them           → Nightlight, so the other can see their way in
  # Someone who isn't home is never waited for.
  bedroom_bedtime_check:
    alias: "Bedroom · Bedtime check"
    icon: mdi:bed-clock
    mode: queued
    sequence:
      - variables:
          me_home: "{{ states('device_tracker.my_phone') in ['home', 'unknown', 'unavailable'] }}"
          partner_home: "{{ states('device_tracker.partner_phone') in ['home', 'unknown', 'unavailable'] }}"
          # In bed = said Goodnight / plugged in after bedtime, OR phone on charge right now
          # (so a phone plugged in before bedtime still counts).
          me_ready: >
            {{ is_state('input_boolean.bedroom_me_in_bed', 'on')
               or is_state('binary_sensor.bedroom_phone_charging', 'on') }}
          partner_ready: >
            {{ is_state('input_boolean.bedroom_partner_in_bed', 'on')
               or is_state('binary_sensor.bedroom_partner_phone_charging', 'on') }}
          someone_ready: "{{ (me_home and me_ready) or (partner_home and partner_ready) }}"
          waiting: "{{ (me_home and not me_ready) or (partner_home and not partner_ready) }}"
      - choose:
          - conditions: "{{ someone_ready and not waiting }}"
            sequence:
              - if: >
                  {{ is_state('input_boolean.bedroom_sleep_mode', 'off')
                     or is_state('input_boolean.bedroom_waiting_for_partner', 'on')
                     or is_state('light.bedroom_all_lights', 'on') }}
                then:
                  - action: script.bedroom_goodnight
          - conditions: "{{ someone_ready and waiting }}"
            sequence:
              - if: >
                  {{ is_state('input_boolean.bedroom_waiting_for_partner', 'off')
                     or is_state('light.bedroom_all_lights', 'off') }}
                then:
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.bedroom_waiting_for_partner }
                  - action: script.bedroom_scene_nightlight

  bedroom_wake_up:
    alias: "Bedroom · Wake-up light"
    icon: mdi:weather-sunset-up
    mode: restart
    variables:
      steps: "{{ states('input_number.bedroom_wake_fade_min') | int(15) }}"
    sequence:
      - action: light.turn_on
        target: { entity_id: light.bedside_lamps }
        data: { brightness_pct: 1, color_temp_kelvin: 2000 }
      # One gentle step per minute: 1% candle → 80% warm gold (never cool white).
      - repeat:
          while:
            - condition: state
              entity_id: light.bedside_lamps
              state: "on"            # stops if you switch them off yourself
            - condition: template
              value_template: "{{ repeat.index <= steps }}"
          sequence:
            - action: light.turn_on
              target: { entity_id: light.bedside_lamps }
              data:
                brightness_pct: "{{ (1 + 79 * repeat.index / steps) | round(0) | int }}"
                color_temp_kelvin: "{{ (2000 + 700 * repeat.index / steps) | round(0) | int }}"
                transition: 55
            - delay: { seconds: 60 }

  bedroom_daylight_unlock:
    alias: "Bedroom · Pause daylight lock (1h)"
    icon: mdi:lock-open-variant
    mode: restart
    sequence:
      - action: timer.start
        target: { entity_id: timer.bedroom_daylight_override }

  bedroom_sleep_timer:
    alias: "Bedroom · Sleep timer"
    icon: mdi:timer-outline
    mode: restart
    fields:
      minutes:
        description: Minutes until the lights fade out
        example: 30
    sequence:
      - action: timer.start
        target: { entity_id: timer.bedroom_sleep_timer }
        data:
          duration: "{{ '%02d:%02d:00' % ((minutes | int(30)) // 60, (minutes | int(30)) % 60) }}"

  bedroom_wind_down:
    alias: "Bedroom · Wind-down"
    icon: mdi:weather-night-partly-cloudy
    mode: single
    variables:
      start_scene: "{{ states('input_text.bedroom_last_scene') }}"
    sequence:
      # Six gentle steps, five minutes apart. Colours stay; only brightness drops.
      # Stops if the lights go off, sleep mode starts, or someone picks a scene.
      - repeat:
          while:
            - condition: state
              entity_id: light.bedroom_all_lights
              state: "on"
            - condition: state
              entity_id: input_boolean.bedroom_sleep_mode
              state: "off"
            - condition: template
              value_template: >
                {{ repeat.index <= 6 and states('input_text.bedroom_last_scene') == start_scene }}
          sequence:
            - variables:
                targets: >
                  {{ expand('light.bedroom_all_lights') | selectattr('state', 'eq', 'on')
                     | selectattr('attributes.brightness', 'defined')
                     | selectattr('attributes.brightness', 'gt', 64)
                     | map(attribute='entity_id') | list }}
            - if: "{{ targets | count > 0 }}"
              then:
                - action: light.turn_on
                  target: { entity_id: "{{ targets }}" }
                  data: { brightness_step_pct: -8, transition: 120 }
            - delay: { minutes: 5 }

###############################################################################
#  AUTOMATIONS
###############################################################################
automation:
  - id: bedroom_apply_defaults
    alias: "Bedroom · Set first-time defaults"
    description: Runs once so all settings start with sensible values.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_defaults_applied
        state: "off"
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.bedroom_bedtime }
        data: { time: "22:30:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.bedroom_wake_time }
        data: { time: "07:00:00" }
      - action: input_number.set_value
        target: { entity_id: input_number.bedroom_goodnight_fade_min }
        data: { value: 1 }
      - action: input_number.set_value
        target: { entity_id: input_number.bedroom_night_brightness }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.bedroom_wake_fade_min }
        data: { value: 15 }
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.bedroom_auto_goodnight
            - input_boolean.bedroom_night_soft_start
            - input_boolean.bedroom_wake_weekdays_only
            - input_boolean.bedroom_away_off
            - input_boolean.bedroom_defaults_applied
      # Daylight lock and wake-up light start OFF – switch them on in the app.

  - id: bedroom_goodnight_on_charge
    alias: "Bedroom · Phone on charge at bedtime → in bed"
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_phone_charging
        from: "off"
        to: "on"
        id: me
      - trigger: state
        entity_id: binary_sensor.bedroom_partner_phone_charging
        from: "off"
        to: "on"
        id: partner
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_auto_goodnight
        state: "on"
      - condition: state
        entity_id: sensor.bedroom_light_period
        state: night
    actions:
      - action: script.bedroom_in_bed
        data: { who: "{{ trigger.id }}" }

  - id: bedroom_bedtime_presence
    alias: "Bedroom · Someone comes home or leaves at bedtime"
    description: >
      Coming home while the other is in bed → Nightlight until you go to bed too.
      Leaving while they wait for you → they stop waiting and the lights go off.
    mode: queued
    triggers:
      - trigger: state
        entity_id: device_tracker.my_phone
        to: ~
        id: me
      - trigger: state
        entity_id: device_tracker.partner_phone
        to: ~
        id: partner
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_wait_for_both_phones
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('input_boolean.bedroom_sleep_mode', 'on')
             or is_state('input_boolean.bedroom_me_in_bed', 'on')
             or is_state('input_boolean.bedroom_partner_in_bed', 'on') }}
    actions:
      - if: "{{ trigger.to_state.state == 'home' }}"
        then:   # just got home, so not in bed yet
          - action: input_boolean.turn_off
            target:
              entity_id: >
                {{ 'input_boolean.bedroom_partner_in_bed' if trigger.id == 'partner' else 'input_boolean.bedroom_me_in_bed' }}
      - action: script.bedroom_bedtime_check

  - id: bedroom_bedtime_reset
    alias: "Bedroom · New day → clear who's in bed"
    triggers:
      - trigger: state
        entity_id: input_boolean.bedroom_sleep_mode
        from: "on"
        to: "off"
      - trigger: time
        at: "12:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.bedroom_me_in_bed
            - input_boolean.bedroom_partner_in_bed
            - input_boolean.bedroom_waiting_for_partner

  - id: bedroom_morning_unplug
    alias: "Bedroom · Phone unplugged in the morning → end sleep mode"
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.bedroom_phone_charging
          - binary_sensor.bedroom_partner_phone_charging
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_sleep_mode
        state: "on"
      # From 90 min before wake time until midday (a 3am phone check won't count).
      - condition: template
        value_template: >
          {{ now() >= today_at(states('input_datetime.bedroom_wake_time')) - timedelta(minutes=90)
             and now().hour < 12 }}
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.bedroom_sleep_mode }

  - id: bedroom_sleep_mode_midday_reset
    alias: "Bedroom · End sleep mode at midday (safety net)"
    triggers:
      - trigger: time
        at: "12:00:00"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.bedroom_sleep_mode }

  - id: bedroom_wake_light
    alias: "Bedroom · Wake-up light"
    triggers:
      - trigger: template
        value_template: >
          {% set start = today_at(states('input_datetime.bedroom_wake_time'))
                         - timedelta(minutes=states('input_number.bedroom_wake_fade_min') | int(15)) %}
          {{ now().strftime('%H:%M') == start.strftime('%H:%M') }}
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_wake_light
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('input_boolean.bedroom_wake_weekdays_only', 'off') or now().weekday() < 5 }}
      - condition: state   # someone is home
        entity_id: binary_sensor.bedroom_someone_home
        state: "on"
    actions:
      - action: script.turn_on
        target: { entity_id: script.bedroom_wake_up }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.bedroom_sleep_mode }

  - id: bedroom_night_soft_start
    alias: "Bedroom · Gentle lights at night"
    description: >
      At night (or in sleep mode), a light switched on by a wall switch, Hue
      dimmer or the Hue app comes on as a dim warm glow instead of full blast.
      The app and Home Assistant scenes are not affected.
    mode: parallel
    triggers:
      - trigger: state
        entity_id: [*lamp_left, *lamp_right, *down_1, *down_2]
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_night_soft_start
        state: "on"
      - condition: template   # turned on outside Home Assistant
        value_template: >
          {{ trigger.to_state.context.user_id is none
             and trigger.to_state.context.parent_id is none }}
      - condition: or
        conditions:
          - condition: state
            entity_id: sensor.bedroom_light_period
            state: night
          - condition: state
            entity_id: input_boolean.bedroom_sleep_mode
            state: "on"
    actions:
      - action: light.turn_on
        target: { entity_id: "{{ trigger.entity_id }}" }
        data:
          brightness_pct: "{{ states('input_number.bedroom_night_brightness') | int(5) }}"
          color_temp_kelvin: 2200

  - id: bedroom_daylight_lock
    alias: "Bedroom · Daylight lock"
    description: >
      In daylight, lights switched on by a wall switch, Hue dimmer or the Hue
      app go straight back off. The app can still turn them on, and
      "Pause daylight lock" lets the switches work for an hour.
    mode: parallel
    triggers:
      - trigger: state
        entity_id: [*lamp_left, *lamp_right, *down_1, *down_2]
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_daytime_lockout
        state: "on"
      - condition: state
        entity_id: binary_sensor.bedroom_is_daytime
        state: "on"
      - condition: state
        entity_id: timer.bedroom_daylight_override
        state: idle
      - condition: template
        value_template: >
          {{ trigger.to_state.context.user_id is none
             and trigger.to_state.context.parent_id is none }}
    actions:
      - delay: { seconds: 1 }
      - action: light.turn_off
        target: { entity_id: "{{ trigger.entity_id }}" }
        data: { transition: 1 }

  - id: bedroom_daylight_lock_sunrise
    alias: "Bedroom · Daylight lock – lights off once it's properly light"
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_is_daytime
        to: "on"
        for: { minutes: 20 }
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_daytime_lockout
        state: "on"
      - condition: state
        entity_id: timer.bedroom_daylight_override
        state: idle
      - condition: state
        entity_id: script.bedroom_wake_up
        state: "off"
    actions:
      - action: light.turn_off
        target: { entity_id: light.bedroom_all_lights }
        data: { transition: 10 }

  - id: bedroom_away_off
    alias: "Bedroom · Everyone left → lights off"
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_someone_home
        from: "on"
        to: "off"
        for: { minutes: 10 }
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_away_off
        state: "on"
    actions:
      - action: light.turn_off
        target: { entity_id: light.bedroom_all_lights }
        data: { transition: 2 }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.bedroom_sleep_mode }

  - id: bedroom_sleep_timer_done
    alias: "Bedroom · Sleep timer finished → fade out"
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.bedroom_sleep_timer }
    actions:
      - action: light.turn_off
        target: { entity_id: light.bedroom_all_lights }
        data: { transition: 60 }

  - id: bedroom_all_lights_off_housekeeping
    alias: "Bedroom · All lights off → cancel sleep timer, clear active scene"
    triggers:
      - trigger: state
        entity_id: light.bedroom_all_lights
        to: "off"
    actions:
      - action: timer.cancel
        target: { entity_id: timer.bedroom_sleep_timer }
      - action: input_text.set_value
        target: { entity_id: input_text.bedroom_last_scene }
        data: { value: "" }

  - id: bedroom_wind_down
    alias: "Bedroom · Wind-down 30 min before bedtime"
    triggers:
      - trigger: template
        value_template: >
          {{ now().strftime('%H:%M')
             == (today_at(states('input_datetime.bedroom_bedtime')) - timedelta(minutes=30)).strftime('%H:%M') }}
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_wind_down
        state: "on"
      - condition: state
        entity_id: light.bedroom_all_lights
        state: "on"
      - condition: state
        entity_id: input_boolean.bedroom_sleep_mode
        state: "off"
    actions:
      - action: script.turn_on
        target: { entity_id: script.bedroom_wind_down }

  - id: bedroom_sunset_welcome
    alias: "Bedroom · Lights on at sunset / when you get home after dark"
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_is_daytime
        from: "on"
        to: "off"
      - trigger: state
        entity_id: binary_sensor.bedroom_someone_home
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_sunset_welcome
        state: "on"
      - condition: state
        entity_id: binary_sensor.bedroom_is_daytime
        state: "off"
      - condition: state
        entity_id: binary_sensor.bedroom_someone_home
        state: "on"
      - condition: state
        entity_id: light.bedroom_all_lights
        state: "off"
      - condition: state
        entity_id: input_boolean.bedroom_sleep_mode
        state: "off"
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.bedroom_light_period
            state: night
    actions:
      - action: script.turn_on
        target: { entity_id: script.bedroom_scene_relax }
